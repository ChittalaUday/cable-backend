services:
  postgres:
    image: postgres:18-alpine
    container_name: cable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cable
      POSTGRES_PASSWORD: cable
      POSTGRES_DB: cable
    ports:
      - '5432:5432'
    volumes:
      - cable-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cable -d cable']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cable-pgdata:
